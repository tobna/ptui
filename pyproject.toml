[project]
name = "ptui"
version = "0.1.0"
description = "A Textual TUI for the papis bibliography manager"
readme = "README.md"
authors = [
    { name = "Tobias Nauen", email = "tobias@nauen-it.de" }
]
requires-python = ">=3.13"
dependencies = [
    "papis>=0.15.0",
    "python-slugify>=8.0.4",
    "ruamel-yaml>=0.19.1",
    "textual>=8.2.8",
]

[project.scripts]
ptui = "ptui.cli:main"

# Makes ptui available as `papis ptui`.
[project.entry-points."papis.command"]
ptui = "ptui.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-textual-snapshot>=1.1.0",
    "ruff>=0.14.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.format]
exclude = ["*.md"]  # ruff would reformat the python blocks in SPEC.md
