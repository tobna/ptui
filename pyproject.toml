[project]
name = "ptui"
version = "0.1.0"
description = "A Textual TUI for the papis bibliography manager"
readme = "README.md"
authors = [
    { name = "Tobias Nauen", email = "tobias@nauen-it.de" }
]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    # Upper bound on purpose: the internal API moved between 0.14 and 0.15, an
    # upstream client/server refactor is in progress, and papis already warns
    # about things it removes in 0.16 (`rename_document_files(allow_remote=...)`,
    # reached through `papis.commands.add`). Tested against 0.15.0 only — raise
    # the ceiling after running the suite against a real 0.16, not before.
    "papis>=0.15.0,<0.16",
    "python-slugify>=8.0.4",
    "ruamel-yaml>=0.19.1",
    "textual>=8.2.8",
]

[project.scripts]
ptui = "ptui.cli:main"

# Makes ptui available as `papis ptui`.
[project.entry-points."papis.command"]
ptui = "ptui.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.4.0",
    "pytest-textual-snapshot>=1.1.0",
    "ruff>=0.14.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Seeded from the user-level ~/.config/ruff/ruff.toml.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
# That set minus "D": this codebase writes prose docstrings on purpose (and
# leaves small helpers undocumented), which D205/D401/D103 all fight.
select = ["E", "F", "B", "NPY", "PD", "TD005", "TD006", "TD007", "SIM", "RET", "ICN", "I", "UP", "RUF"]
ignore = [
  "E501",                        # the formatter owns line length
  "NPY002",
  "B008",
  "PD011",
  "SIM118",
  "RUF001", "RUF002", "RUF003",  # × and – in prose are intentional
]
unfixable = ["B"]

[tool.ruff.format]
exclude = ["*.md"]  # ruff would reformat the python blocks in SPEC.md
docstring-code-format = true
docstring-code-line-length = "dynamic"
