name: test

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"  # the floor pyproject allows
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
